name: Trigger auto deployment for focusguard-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/focusguard-app-AutoDeployTrigger-a60caa82-f1c5-4786-8dd5-064cda1ef1f1.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FOCUSGUARDAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FOCUSGUARDAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FOCUSGUARDAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.FOCUSGUARDAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FOCUSGUARDAPP_REGISTRY_PASSWORD }}
          containerAppName: focusguard-app
          resourceGroup: focusguard-rg2
          imageToBuild: amaratraiq/focusguard-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


