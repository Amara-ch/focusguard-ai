name: Trigger auto deployment for focusguard-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ webrtc-fix ]
    paths:
    - '**'
    - '.github/workflows/focusguard-app-AutoDeployTrigger-4777475a-e781-4e99-a38b-fd0fd67f4c3d.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.FOCUSGUARDAPP_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.FOCUSGUARDAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FOCUSGUARDAPP_REGISTRY_PASSWORD }}
          containerAppName: focusguard-app
          resourceGroup: focusguard-rg2
          imageToBuild: amaratraiq/amaratraiq/focusguard:${{ github.sha }}
          
            

     

